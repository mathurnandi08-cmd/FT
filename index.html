<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FT_38100 OVERRIDE // CYBER-LINK</title>
    <style>
        :root {
            --bg-color: #08080a;
            --panel-bg: rgba(15, 20, 25, 0.85);
            --neon-cyan: #00ffff;
            --neon-pink: #ff00ff;
            --neon-green: #33ff33;
            --neon-red: #ff3333;
            --neon-yellow: #ffff33;
            --border-glow: rgba(0, 255, 255, 0.5);
            --font-main: 'Courier New', Courier, monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--neon-cyan);
            font-family: var(--font-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            /* Cyber grid background */
            background-image: 
                linear-gradient(rgba(0, 255, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 30px 30px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Glitchy Header */
        .header {
            text-align: center;
            padding: 15px;
            border: 1px solid var(--neon-cyan);
            background: var(--panel-bg);
            box-shadow: 0 0 15px var(--border-glow);
            text-transform: uppercase;
            letter-spacing: 4px;
            font-weight: bold;
            font-size: 1.5rem;
            position: relative;
            overflow: hidden;
        }
        
        .header::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 50%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 255, 255, 0.2), transparent);
            animation: scanline 3s infinite linear;
        }

        @keyframes scanline {
            0% { left: -100%; }
            100% { left: 200%; }
        }

        /* Status Bar */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--panel-bg);
            border: 1px solid var(--neon-pink);
            padding: 15px 20px;
            box-shadow: 0 0 10px rgba(255, 0, 255, 0.2);
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .pulse-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background-color: var(--neon-red);
            box-shadow: 0 0 10px var(--neon-red);
        }

        .pulse-dot.active {
            background-color: var(--neon-green);
            box-shadow: 0 0 15px var(--neon-green);
        }

        /* Action Buttons Grid */
        .controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn {
            background: transparent;
            color: var(--neon-cyan);
            border: 1px solid var(--neon-cyan);
            padding: 18px 20px;
            font-size: 1.1rem;
            font-family: var(--font-main);
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .btn:hover:not(:disabled) {
            background: rgba(0, 255, 255, 0.15);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.4);
            text-shadow: 0 0 5px var(--neon-cyan);
        }

        .btn:active:not(:disabled) {
            transform: translateY(2px);
        }

        .btn:disabled {
            border-color: #444;
            color: #666;
            cursor: not-allowed;
            background: rgba(20, 20, 20, 0.5);
        }

        .btn-accent {
            border-color: var(--neon-pink);
            color: var(--neon-pink);
        }
        .btn-accent:hover:not(:disabled) {
            background: rgba(255, 0, 255, 0.15);
            box-shadow: 0 0 20px rgba(255, 0, 255, 0.4);
            text-shadow: 0 0 5px var(--neon-pink);
        }

        /* Terminal Window */
        .terminal {
            background: #000;
            border: 1px solid #333;
            height: 350px;
            display: flex;
            flex-direction: column;
            border-left: 4px solid var(--neon-cyan);
        }

        .terminal-head {
            background: #111;
            padding: 8px 15px;
            font-size: 0.85rem;
            color: #888;
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
        }

        .log-container {
            flex-grow: 1;
            padding: 15px;
            overflow-y: auto;
            font-size: 0.9rem;
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .log-line { word-break: break-all; }
        .log-time { color: #666; margin-right: 12px; }
        .log-info { color: #aaa; }
        .log-success { color: var(--neon-green); }
        .log-error { color: var(--neon-red); font-weight: bold; }
        .log-rx { color: var(--neon-yellow); }
        .log-tx { color: var(--neon-pink); }
        .log-warn { color: #ff8800; }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb { background: #333; }
        ::-webkit-scrollbar-thumb:hover { background: var(--neon-cyan); }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">FT_38100 OVERRIDE TERMINAL</div>

        <div class="status-bar">
            <div class="status-indicator">
                <div id="status-dot" class="pulse-dot"></div>
                <span id="status-text">OFFLINE</span>
            </div>
            <div style="font-size: 0.9rem; color: #888;">GATT_PROTOCOL</div>
        </div>

        <div class="controls">
            <button id="btn-connect" class="btn" onclick="connectWatch()">
                <span>[01] CONNECT WATCH</span>
                <span>>></span>
            </button>
            
            <button id="btn-bypass" class="btn btn-accent" onclick="bypassSetup()" disabled>
                <span>[02] BYPASS SETUP / UNLOCK</span>
                <span>>></span>
            </button>
            
            <button id="btn-sync" class="btn" onclick="syncTime()" disabled>
                <span>[03] SYNC RTC TIME</span>
                <span>>></span>
            </button>
        </div>

        <div class="terminal">
            <div class="terminal-head">
                <span>LOCAL_CONSOLE</span>
                <span>DATA_STREAM</span>
            </div>
            <div id="terminal-logs" class="log-container">
                <!-- Logs injected here -->
            </div>
        </div>
    </div>

    <script>
        // UUID Constants
        const SERVICE_UUID = '00000af0-0000-1000-8000-00805f9b34fb';
        const CHAR_WRITE = '00000af6-0000-1000-8000-00805f9b34fb';
        const CHAR_NOTIFY_1 = '00000af7-0000-1000-8000-00805f9b34fb';
        const CHAR_NOTIFY_2 = '00000af2-0000-1000-8000-00805f9b34fb';

        // State Variables
        let bleDevice = null;
        let gattServer = null;
        let bleService = null;
        let writeChar = null;
        let notifyChar1 = null;
        let notifyChar2 = null;
        let heartbeatInterval = null;

        // DOM Elements
        const logBox = document.getElementById('terminal-logs');
        const statusDot = document.getElementById('status-dot');
        const statusText = document.getElementById('status-text');
        const btnConnect = document.getElementById('btn-connect');
        const btnBypass = document.getElementById('btn-bypass');
        const btnSync = document.getElementById('btn-sync');

        // Utility: Logger
        function log(msg, type = 'info') {
            const line = document.createElement('div');
            line.className = 'log-line';
            
            const now = new Date();
            const time = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}.${String(now.getMilliseconds()).padStart(3,'0')}`;
            
            line.innerHTML = `<span class="log-time">[${time}]</span><span class="log-${type}">${msg}</span>`;
            
            logBox.appendChild(line);
            logBox.scrollTop = logBox.scrollHeight;
        }

        // Utility: Convert Byte Array to Hex String (e.g., "[0xAA, 0x01]")
        function toHexStr(arr) {
            return '[' + Array.from(arr).map(b => '0x' + b.toString(16).padStart(2, '0').toUpperCase()).join(', ') + ']';
        }

        // Utility: Async Delay
        const delay = ms => new Promise(res => setTimeout(res, ms));

        async function connectWatch() {
            if (!navigator.bluetooth) {
                log('CRITICAL ERROR: Web Bluetooth API not supported or enabled in this browser.', 'error');
                return;
            }

            try {
                log('Initiating scan for FT_* devices...', 'info');
                bleDevice = await navigator.bluetooth.requestDevice({
                    filters: [{ namePrefix: 'FT_' }],
                    optionalServices: [SERVICE_UUID]
                });

                log(`Target Acquired: ${bleDevice.name} (${bleDevice.id})`, 'success');
                bleDevice.addEventListener('gattserverdisconnected', handleDisconnect);

                log('Connecting to GATT Server...', 'info');
                gattServer = await bleDevice.gatt.connect();

                log(`Requesting Primary Service: 0x0AF0...`, 'info');
                bleService = await gattServer.getPrimaryService(SERVICE_UUID);

                log(`Fetching Write Characteristic (0x0AF6)...`, 'info');
                writeChar = await bleService.getCharacteristic(CHAR_WRITE);
                
                log(`Fetching Notify Characteristics (0x0AF7, 0x0AF2)...`, 'info');
                notifyChar1 = await bleService.getCharacteristic(CHAR_NOTIFY_1);
                notifyChar2 = await bleService.getCharacteristic(CHAR_NOTIFY_2);

                // Setup Notifications sequentially to avoid DOMExceptions
                log('Subscribing to 0x0AF7 notifications...', 'info');
                await notifyChar1.startNotifications();
                notifyChar1.addEventListener('characteristicvaluechanged', handleIncomingData);

                log('Subscribing to 0x0AF2 notifications...', 'info');
                await notifyChar2.startNotifications();
                notifyChar2.addEventListener('characteristicvaluechanged', handleIncomingData);

                log('GATT LINK ESTABLISHED. SYSTEM READY.', 'success');
                
                updateUI(true);
                startHeartbeat();

            } catch (err) {
                log(`Connection Sequence Failed: ${err.message}`, 'error');
                updateUI(false);
            }
        }

        async function sendData(byteArray, description = "") {
            if (!writeChar) {
                log('ERROR: Write Characteristic not available.', 'error');
                return;
            }
            try {
                const data = new Uint8Array(byteArray);
                // ALWAYS use writeValueWithoutResponse per specs to prevent watchdog panic
                await writeChar.writeValueWithoutResponse(data);
                log(`TX ${description}: ${toHexStr(data)}`, 'tx');
            } catch (err) {
                log(`TX ERROR: ${err.message}`, 'error');
            }
        }

        async function bypassSetup() {
            log('INITIATING BYPASS SEQUENCE...', 'warn');
            
            // Packet 1: Initial ACK
            const packet1 = [0xAA, 0x01, 0x01, 0x00];
            await sendData(packet1, '(ACK)');
            
            // Required 300ms delay between packets
            await delay(300);
            
            // Packet 2: Bind Confirm
            const packet2 = [0xAA, 0x03, 0x01, 0x01, 0x00];
            await sendData(packet2, '(BIND CONFIRM)');
            
            log('Bypass Sequence transmitted. Watch should be unlocked.', 'success');
        }

        async function syncTime() {
            log('CONSTRUCTING GENUINE RTC SYNC PAYLOAD...', 'info');
            
            const now = new Date();
            const year = now.getFullYear();
            const month = now.getMonth() + 1;
            const day = now.getDate();
            const hours = now.getHours();
            const minutes = now.getMinutes();
            const seconds = now.getSeconds();

            // Sifli / Titan Protocol Standard Time Frame (CMD 0x04, Sub 0x00)
            const payload = [
                0xAA,
                0x04,
                0x00,
                (year >> 8) & 0xFF,
                year & 0xFF,
                month,
                day,
                hours,
                minutes,
                seconds
            ];

            await sendData(payload, '(RTC TIME SET)');
            log(`Time Packet Sent: ${hours}:${minutes}:${seconds}`, 'success');
        }

        function startHeartbeat() {
            // Send keep-alive packet [0xAA, 0x05, 0x00] every 15 seconds
            log('Initializing Heartbeat Protocol (15s interval)...', 'info');
            if (heartbeatInterval) clearInterval(heartbeatInterval);
            
            heartbeatInterval = setInterval(() => {
                if (writeChar && bleDevice && bleDevice.gatt.connected) {
                    sendData([0xAA, 0x05, 0x00], '(HEARTBEAT)');
                } else {
                    clearInterval(heartbeatInterval);
                }
            }, 15000);
        }

        function handleIncomingData(event) {
            const dataView = event.target.value;
            const bytes = new Uint8Array(dataView.buffer);
            // Identify which characteristic fired this
            const uuid = event.target.uuid.substring(4, 8).toUpperCase();
            log(`RX [${uuid}]: ${toHexStr(bytes)}`, 'rx');
        }

        function handleDisconnect() {
            log('GATT SERVER DISCONNECTED. LINK LOST.', 'error');
            updateUI(false);
            if (heartbeatInterval) {
                clearInterval(heartbeatInterval);
                heartbeatInterval = null;
            }
            writeChar = null;
            notifyChar1 = null;
            notifyChar2 = null;
            bleService = null;
            gattServer = null;
        }

        function updateUI(isConnected) {
            btnBypass.disabled = !isConnected;
            btnSync.disabled = !isConnected;
            btnConnect.disabled = isConnected;
            
            if (isConnected) {
                statusDot.classList.add('active');
                statusText.textContent = `CONNECTED: ${bleDevice.name.toUpperCase()}`;
                statusText.style.color = 'var(--neon-green)';
                btnConnect.innerHTML = `<span>[01] CONNECTED</span><span>✓</span>`;
            } else {
                statusDot.classList.remove('active');
                statusText.textContent = 'OFFLINE';
                statusText.style.color = 'var(--neon-cyan)';
                btnConnect.innerHTML = `<span>[01] CONNECT WATCH</span><span>>></span>`;
            }
        }

        // Init System
        window.onload = () => {
            log('SYSTEM BOOT. AWAITING OPERATOR INPUT.', 'info');
        };
    </script>
</body>
</html>
